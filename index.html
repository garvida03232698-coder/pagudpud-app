<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagudpud Perimeter Adventures</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B5D6B">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ocean-deep:#0B5D6B;
    --ocean:#137A8F;
    --seafoam:#4FB8A8;
    --sand:#F5DFAE;
    --sand-light:#FBF3DF;
    --coral:#FF6F59;
    --sun:#FFC93C;
    --ink:#12363B;
    --white:#ffffff;
    --shadow: rgba(11,93,107,0.25);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 10% 0%, #a8e6da 0%, transparent 40%),
      linear-gradient(180deg, #d7f2ee 0%, #eaf7f2 40%, var(--sand-light) 100%);
    min-height:100vh;
    padding:0 0 60px 0;
  }
  .wave-header{
    position:relative;
    padding:36px 24px 70px;
    overflow:hidden;
    text-align:center;
    background:var(--ocean-deep);
  }
  .beach-bg{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    z-index:0;
  }
  .header-inner{
    position:relative;
    z-index:2;
  }
  .wave-header::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:50px;
    background:var(--sand-light);
    z-index:1;
    clip-path: polygon(0% 100%, 0% 40%, 5% 45%, 10% 55%, 15% 45%, 20% 35%, 25% 45%, 30% 55%, 35% 45%, 40% 35%, 45% 45%, 50% 55%, 55% 45%, 60% 35%, 65% 45%, 70% 55%, 75% 45%, 80% 35%, 85% 45%, 90% 55%, 95% 45%, 100% 40%, 100% 100%);
  }
  .brand-row{
    display:flex; align-items:center; justify-content:center; gap:12px;
    font-family:'Baloo 2', sans-serif;
  }
  .brand-row .sun{
    font-size:34px;
    animation: bob 4s ease-in-out infinite;
  }
  @keyframes bob{ 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-6px) rotate(8deg);} }
  h1{
    font-family:'Baloo 2', sans-serif;
    color:var(--white);
    font-size:clamp(28px, 4.5vw, 42px);
    margin:8px 0 4px;
    letter-spacing:0.5px;
    text-shadow: 0 3px 0 rgba(0,0,0,0.12);
  }
  .subtitle{
    color:#eafffb;
    font-weight:700;
    font-size:15px;
    opacity:0.95;
    margin-bottom:0;
  }
  .name-row{
    display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-top:22px;
  }
  .name-row input{
    font-family:'Nunito',sans-serif;
    font-weight:700;
    border:none;
    border-radius:12px;
    padding:9px 14px;
    font-size:14px;
    background:rgba(255,255,255,0.92);
    color:var(--ink);
    min-width:150px;
  }
  .name-row input::placeholder{color:#5b8a8f;}

  .tide-bar-wrap{
    max-width:720px;
    margin:-46px auto 30px;
    padding:0 20px;
    position:relative;
    z-index:2;
  }
  .tide-card{
    background:var(--white);
    border-radius:20px;
    box-shadow:0 10px 30px var(--shadow);
    padding:16px 22px;
    display:flex;
    align-items:center;
    gap:16px;
  }
  .tide-label{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:14px;
    color:var(--ocean-deep);
    white-space:nowrap;
  }
  .tide-track{
    flex:1;
    height:18px;
    background:#e3f3f0;
    border-radius:12px;
    overflow:hidden;
    position:relative;
  }
  .tide-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--seafoam), var(--sun));
    border-radius:12px;
    transition:width 0.6s ease;
    position:relative;
  }
  .shell-strip{
    font-size:20px;
    letter-spacing:2px;
    min-height:24px;
    text-align:center;
    margin-top:8px;
  }

  main{
    max-width:900px;
    margin:0 auto;
    padding:0 20px;
  }

  .page{
    position:relative;
    width:100%;
    margin:0 auto 28px;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 10px 30px var(--shadow);
    background:#fff;
  }
  .page img{
    width:100%;
    display:block;
  }
  .blank{
    position:absolute;
    transform:translate(-50%,-50%);
    text-align:center;
    font-family:'Nunito', sans-serif;
    font-weight:800;
    color:var(--ocean-deep);
    background:rgba(255,255,255,0.88);
    border:2px solid var(--ocean);
    border-radius:6px;
    font-size:clamp(9px, 1.7vw, 16px);
    padding:1px 2px;
  }
  .blank:focus{
    outline:none;
    border-color:var(--sun);
    background:#ffffff;
  }
  .blank.correct{
    border-color:#1a8f5a;
    background:rgba(198,244,214,0.95);
    color:#1a8f5a;
  }
  .blank.wrong{
    border-color:var(--coral);
    background:rgba(255,224,219,0.95);
  }
  .blank:disabled{
    opacity:1;
    -webkit-text-fill-color:inherit;
    cursor:not-allowed;
  }
  .blank.correct:disabled{
    color:#1a8f5a;
  }
  .blank.wrong:disabled{
    color:#a33;
  }

  .reset-wrap{
    text-align:center;
    margin-top:8px;
  }
  .reset-btn{
    font-family:'Baloo 2',sans-serif;
    background:none;
    border:2px solid var(--ocean);
    color:var(--ocean-deep);
    border-radius:12px;
    padding:8px 18px;
    font-weight:700;
    cursor:pointer;
    font-size:13px;
  }
  .reset-btn:hover{
    background:var(--ocean);
    color:white;
  }
  footer{
    text-align:center;
    color:#3c6a6f;
    font-weight:700;
    font-size:13px;
    margin-top:10px;
  }

  .blank.reveal{
    background:#FFF4C2 !important;
    color:#B34700 !important;
    border:2px dashed #FF6F59 !important;
    font-weight:800;
    opacity:1 !important;
  }
</style>
</head>

<script>
const inputs = document.querySelectorAll('.blank.ans');
const totalCount = inputs.length;
const shellPool = ["🐚","⭐","🐠","🦀","🌺"];
let correctCount = 0;

// Simple sound effects using Web Audio API
let audioCtx;
function getCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playTone(freqs, duration, type='sine', volume=0.15){
  try {
    const ctx = getCtx();
    const now = ctx.currentTime;
    freqs.forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(f.freq, now + f.t);
      gain.gain.setValueAtTime(0, now + f.t);
      gain.gain.linearRampToValueAtTime(volume, now + f.t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, now + f.t + f.d);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + f.t);
      osc.stop(now + f.t + f.d + 0.02);
    });
  } catch(e){}
}
function playCorrect(){
  // cheerful ascending arpeggio
  playTone([
    {freq: 660, t: 0,    d: 0.12},
    {freq: 880, t: 0.10, d: 0.12},
    {freq: 1320,t: 0.20, d: 0.22}
  ], 0.5, 'triangle', 0.18);
}
function playWrong(){
  // soft descending buzz
  playTone([
    {freq: 300, t: 0,    d: 0.18},
    {freq: 200, t: 0.16, d: 0.28}
  ], 0.5, 'sawtooth', 0.10);
}


function updateProgress(){
  const pct = totalCount ? Math.round((correctCount/totalCount)*100) : 0;
  document.getElementById('tideFill').style.width = pct + '%';
  document.getElementById('scoreText').textContent = correctCount + ' / ' + totalCount;
  let strip = '';
  for(let i=0;i<correctCount;i++){ strip += shellPool[i % shellPool.length]; }
  document.getElementById('shellStrip').textContent = strip;
}

function lockIn(inp){
  if(inp.dataset.locked === "true") return; // already used their one try
  const val = parseFloat(inp.value);
  const expected = parseFloat(inp.dataset.answer);
  if(isNaN(val)) return; // nothing typed yet, don't lock on an empty blank

  inp.dataset.locked = "true";
  inp.disabled = true;

  if(val === expected){
    inp.classList.add('correct');
    correctCount++;
    playCorrect();
  } else {
    inp.classList.add('wrong');
    playWrong();
  }
  updateProgress();
  checkAllAnswered();
}

function checkAllAnswered(){
  const anyAnswered = Array.from(inputs).some(i => i.value.trim() !== '');
  const allAnswered = Array.from(inputs).every(i => i.value.trim() !== '');
  const btn = document.getElementById('revealBtn');
  if(btn){
    if(allAnswered){
      btn.disabled = false;
      btn.style.opacity = '1';
      btn.style.cursor = 'pointer';
    } else {
      btn.disabled = true;
      btn.style.opacity = '0.5';
      btn.style.cursor = 'not-allowed';
    }
  }
}

function revealAnswers(){
  inputs.forEach(inp => {
    if(!inp.classList.contains('correct')){
      inp.value = inp.dataset.answer;
      inp.classList.remove('wrong');
      inp.classList.add('reveal');
      inp.dataset.locked = "true";
      inp.disabled = true;
    }
  });
}

inputs.forEach(inp => {
  inp.dataset.locked = "false";
  inp.addEventListener('input', checkAllAnswered);
  inp.addEventListener('blur', () => lockIn(inp));
  inp.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      e.preventDefault();
      inp.blur(); // triggers lockIn via the blur listener above
    }
  });
});

function resetAll(){
  inputs.forEach(inp => {
    inp.value = '';
    inp.classList.remove('correct','wrong','reveal');
    inp.dataset.locked = "false";
    inp.disabled = false;
  });
  correctCount = 0;
  updateProgress();
  checkAllAnswered();
}

updateProgress();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
